      <stop offset="0%" stop-color="#FBE29A"/>
      <stop offset="45%" stop-color="#E3B23C"/>
      <stop offset="100%" stop-color="#A87D28"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D580"/>
      <stop offset="100%" stop-color="#C9962E"/>
    </linearGradient>
    <radialGradient id="felt" cx="50%" cy="35%" r="65%">
