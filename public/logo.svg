  <text x="400" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#F3EDE6" letter-spacing="1">Poker<tspan fill="url(#goldFlat)">Crew</tspan></text>
  <text x="404" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#A79AB3" letter-spacing="10">PRIVATE POKER CLUBS</text>
