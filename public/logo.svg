      <rect x="140" y="482" width="70" height="60" rx="14"/><rect x="814" y="482" width="70" height="60" rx="14"/>
      <g transform="rotate(45 512 512)">
        <rect x="482" y="140" width="60" height="70" rx="14"/><rect x="482" y="814" width="60" height="70" rx="14"/>
        <rect x="140" y="482" width="70" height="60" rx="14"/><rect x="814" y="482" width="70" height="60" rx="14"/>
      </g>
    </g>
    <circle cx="512" cy="512" r="292" fill="#2A1E3C"/>
    <circle cx="512" cy="512" r="280" fill="url(#felt)"/>
    <circle cx="512" cy="512" r="262" fill="none" stroke="#E3B23C" stroke-opacity="0.35" stroke-width="3"/>
    <path fill="url(#goldFlat)" d="M512 318 C 560 400, 690 468, 690 560 C 690 630, 630 668, 578 640 C 552 626, 536 606, 528 590 L 528 592 C 534 640, 552 676, 590 700 L 434 700 C 472 676, 490 640, 496 592 L 496 590 C 488 606, 472 626, 446 640 C 394 668, 334 630, 334 560 C 334 468, 464 400, 512 318 Z"/>
